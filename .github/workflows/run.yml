name: Cloud check in action
on:
  push:
    branches:
      - main
  watch:
    types: started
  workflow_dispatch:
  schedule:
    - cron: 35 2 * * *
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: user
    env:
      # 只暴露用到的密钥；整包 toJSON(secrets) 会被 GitHub 判定为高风险，run 直接卡在 action_required
      # TY_ACCOUNTS 在下方步骤过滤后通过 GITHUB_ENV 注入
      TY_ACCOUNTS_RAW: ${{ secrets.TY_ACCOUNTS }}
      EXEC_THRESHOLD: ${{ secrets.EXEC_THRESHOLD }}
      SHOWDOC_KEY: ${{ secrets.SHOWDOC_KEY }}
      WX_PUSHER_UID: ${{ secrets.WX_PUSHER_UID }}
    steps:
      - name: 🔀 random delay 0-300 seconds
        run: sleep $((RANDOM % 301))

      - name: 🔌 Check out code
        uses: actions/checkout@main

      - name: 🔨 Setup Node.js environment
        uses: actions/setup-node@main
        with:
          node-version: 18
          cache: npm

      - name: 👾 Check if Debug is true
        if: vars.debug == '1'
        run: |
          echo "CLOUD189_VERBOSE=1" >> $GITHUB_ENV
      
      - name: 📹 Restore cached Cookie
        id: cache-cookie-restore
        uses: actions/cache/restore@v4
        with:
          path: .token
          key: ${{ runner.os }}-cache-token
          restore-keys: ${{ runner.os }}-cache-token-

      - name: 📡 Init dependencies
        run: npm install

      - name: 🚫 排除失效账号 156****2001
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const list = JSON.parse(process.env.TY_ACCOUNTS_RAW || '[]');
          const kept = list.filter((a) => !(String(a.userName).startsWith('156') && String(a.userName).endsWith('2001')));
          console.log(`账号过滤: ${list.length} -> ${kept.length}`);
          if (kept.length === list.length) console.log('警告: 未匹配到 156****2001');
          fs.appendFileSync(process.env.GITHUB_ENV, 'TY_ACCOUNTS=' + JSON.stringify(kept) + '\n');
          EOF

      - name: 🚀 Run
        uses: nick-fields/retry@master
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: npm start
      
      - name: 📹 Save cached Cookie
        uses: actions/cache/save@v4
        with:
          path: .token
          key: ${{ runner.os }}-cache-token-${{ hashFiles('.token/*.json') }}

      - name: 🚗 Keep Running
        if: github.event_name == 'schedule'
        run: |
          git config --local user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git config --local user.name "${{ github.actor }}"
          git remote set-url origin https://${{ github.actor }}:${{ github.token }}@github.com/${{ github.repository }}
          git pull --rebase --autostash
          git commit --allow-empty -m "Keep Running..."
          git push

      - name: 🎉 Delete old workflow run
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 50