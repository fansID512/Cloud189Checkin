name: p6-secrets
on:
  workflow_dispatch:
jobs:
  p6:
    runs-on: ubuntu-latest
    environment: user
    steps:
      - name: checkout
        uses: actions/checkout@main
      - name: init secrets
        uses: shine1594/secrets-to-env-action@master
        with:
          secrets: ${{ toJSON(secrets) }}
          secrets_env: production
          prefix_prod: ""
          file_name_prod: .env
      - run: echo p6 done
